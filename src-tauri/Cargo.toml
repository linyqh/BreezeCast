[package]
name = "breezecast"
version = "0.1.0"
description = "BreezeCast — local podcast studio powered by BreezeTTS 2 and audio.cpp"
authors = ["BreezeCast"]
license = "Apache-2.0"
edition = "2024"

[lib]
name = "breezecast_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
tower = { version = "0.5", features = ["util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
hound = "3"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
async-stream = "0.3"
anyhow = "1"
parking_lot = "0.12"
rand = "0.9"
chrono = { version = "0.4", features = ["serde"] }
if-addrs = "0.13"
symphonia = { version = "0.6", default-features = false, features = ["aac", "alac", "flac", "mp3", "pcm", "vorbis", "adpcm", "isomp4", "caf", "aiff", "wav", "ogg", "mkv"] }
rubato = "5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Media_MediaFoundation", "Win32_System_Com"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
